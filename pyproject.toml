[project]
name = "ficbook-downloader"
version = "0.4.0"
description = "Save ficbook.net stories as txt, EPUB, and FB2 files."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "curl_cffi>=0.7",
    "pillow>=10",
]
authors = [{ name = "Yaroslau Hatalski" }]

[project.scripts]
ficbook-dl = "ficbook_dl.__main__:main"
ficbook-gui = "ficbook_dl.gui:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
