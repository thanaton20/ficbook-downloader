name: Windows exe

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag that receives the exe
        required: true
        default: v0.3.0

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller .

      - name: Build one-file window
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name Ficbook-Downloader --collect-all curl_cffi --collect-all PIL --collect-all bs4 packaging/launcher.py

      - name: Attach exe to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: dist/Ficbook-Downloader.exe
